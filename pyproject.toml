[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "les-cryptes-d-ombrefer"
version = "0.9.0"
description = "Jeu de rôle en mode texte, joué dans le terminal"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ombrefer = "ombrefer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Permet à pylint de trouver le jeu même si un commit ne touche qu'un seul dossier.
[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"
