name: Lint

# Lancée à chaque push (toutes branches) et à chaque pull request vers main
on:
  push:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Garde les environnements des hooks entre deux exécutions (pipeline plus rapide)
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Installer pre-commit
        run: pip install pre-commit

      # Mêmes vérifications qu'en local, mais sur tous les fichiers.
      # no-commit-to-branch est ignoré : après un merge, la pipeline tourne sur main.
      - name: Lancer les linters
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
